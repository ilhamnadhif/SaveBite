name: savebite
description: "SaveBite — marketplace Surprise Bag (makanan surplus). Mockup Flutter dari desain Claude Design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.15.0
  image_picker: ^1.2.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
