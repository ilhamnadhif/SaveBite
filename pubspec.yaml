name: savebite
description: "SaveBite — marketplace Surprise Bag untuk menyelamatkan makanan surplus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.16.0
  # Dipakai langsung untuk callback browser pembayaran; jangan mengandalkan
  # dependency transitif dari supabase_flutter.
  app_links: ^7.0.0
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  # Checkout Snap tetap berada di dalam aplikasi Android/iOS. Flutter web
  # memakai Snap.js resmi karena WebView tidak tersedia di browser.
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Hanya URL + publishable/anon key Supabase dan Midtrans Client Key
    # (semuanya public client values). Jangan pernah menaruh service-role,
    # Midtrans Server Key, atau secret payment lain di asset.
    - assets/config/client.env

  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
